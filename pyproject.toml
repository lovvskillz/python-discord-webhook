[project]
name = "discord-webhook"
version = "1.4.1"
description = "Easily send Discord webhooks with Python"
authors = [
    { name = "lovvskillz", email = "14542790+lovvskillz@users.noreply.github.com" },
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
keywords = ["discord", "webhook"]
dependencies = [
    "requests>=2.32.3,<3",
]

[project.optional-dependencies]
async = ["httpx>=0.28.1,<1"]

[project.urls]
Repository = "https://github.com/lovvskillz/python-discord-webhook"

[project.scripts]
discord_webhook = "discord_webhook.__main__:main"

[dependency-groups]
dev = [
    "pre-commit>=3.3.3",
    "types-requests>=2.28.11.4",
    "pytest>=7.4.0",
    "ruff>=0.1.15,<0.2",
]

[tool.hatch.build.targets.wheel]
packages = ["discord_webhook"]

[tool.ruff]
line-length = 88
ignore = ["E501"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
